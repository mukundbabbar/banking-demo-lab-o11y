apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
spec:
  selector:
    matchLabels:
      name: web-frontend
  replicas: 1
  template:
    metadata:
      labels:
        name: web-frontend
    spec:
      containers:
        - name: web-frontend
          image: mukundbabbar/banking-demo:v1.080826-0459
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8080
          env:
            - name: SPLUNK_OTEL_AGENT
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: web-frontend
            - name: SPLUNK_SNAPSHOT_PROFILER_ENABLED
              value: "true"
            - name: SPLUNK_PROFILER_LOGS_ENDPOINT
              value: "http://$(SPLUNK_OTEL_AGENT):4317"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(SPLUNK_OTEL_AGENT):4318"
            - name: SPLUNK_SNAPSHOT_PROFILER_SAMPLING_INTERVAL
              value: "1ms"
            - name: SPLUNK_SNAPSHOT_SELECTION_PROBABILITY
              value: "0.1"
            - name: SPLUNK_SNAPSHOT_PROFILER_MAX_STACK_DEPTH
              value: "2048"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: ""
            - name: SPLUNK_OPAMP_ENABLED
              value: "true"
            - name: SPLUNK_OPAMP_ENDPOINT
              value: "http://$(SPLUNK_OTEL_AGENT):4320/v1/opamp"
          envFrom:
          - configMapRef:
              name: agent-config
          volumeMounts:
          - mountPath: /tmp/agent/
            name: splunk-otel-java
      initContainers:
      - name: splunk-otel-init
        image: busybox
        command: ["/bin/sh","-c"]
        args: ["wget https://github.com/signalfx/splunk-otel-java/releases/latest/download/splunk-otel-javaagent.jar -O /tmp/splunk-otel-javaagent.jar"]
        volumeMounts:
        - mountPath: /tmp
          name: splunk-otel-java
      volumes:
      - emptyDir: {}
        name: splunk-otel-java

---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
spec:
  selector:
    name: web-frontend
  ports:
  - name: "8080"
    port: 8080
    targetPort: 8080
status:
  loadBalancer: {}
