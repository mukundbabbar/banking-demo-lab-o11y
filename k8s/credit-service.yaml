apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-service
spec:
  selector:
    matchLabels:
      name: credit-service
  replicas: 1
  template:
    metadata:
      labels:
        name: credit-service
    spec:
      containers:
        - name: credit-service
           image: mukundbabbar/java-apps:v1.1
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8080
          env:
            - name: SPLUNK_OTEL_AGENT
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: credit-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(SPLUNK_OTEL_AGENT):4318"
            - name: SPLUNK_OPAMP_ENABLED
              value: "true"
            - name: SPLUNK_OPAMP_ENDPOINT
              value: "http://$(SPLUNK_OTEL_AGENT):4320/v1/opamp"
          envFrom:
          - configMapRef:
              name: agent-config
          volumeMounts:
          - mountPath: /tmp/agent/
            name: splunk-otel-java
      initContainers:
      - name: splunk-otel-init
        image: busybox
        command: ["/bin/sh","-c"]
        args: ["wget https://github.com/signalfx/splunk-otel-java/releases/latest/download/splunk-otel-javaagent.jar -O /tmp/splunk-otel-javaagent.jar"]
        volumeMounts:
        - mountPath: /tmp
          name: splunk-otel-java
      volumes:
      - emptyDir: {}
        name: splunk-otel-java

---
apiVersion: v1
kind: Service
metadata:
  name: credit-service
spec:
  selector:
    name: credit-service
  ports:
  - name: "8080"
    port: 8080
    targetPort: 8080
status:
  loadBalancer: {}
